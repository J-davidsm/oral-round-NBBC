<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Story Weaver</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar styling */
        .story-scroll::-webkit-scrollbar {
            width: 8px;
        }
        .story-scroll::-webkit-scrollbar-thumb {
            background-color: #3b82f6; /* blue-500 */
            border-radius: 4px;
        }
        .story-scroll::-webkit-scrollbar-track {
            background-color: #e5e7eb; /* gray-200 */
        }
        /* Custom font */
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Hide the initial setup until loaded */
        #app-container {
            display: none;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div id="app-container" class="w-full max-w-2xl bg-white shadow-2xl rounded-xl p-6 md:p-8 space-y-6">

        <!-- Header -->
        <header class="text-center">
            <h1 class="text-4xl font-extrabold text-gray-900">
                Story Weaver
            </h1>
            <p class="text-gray-500 mt-1">Your prompt, your choices, your story.</p>
        </header>

        <!-- IP address display (gold text) -->
        <div id="ip-message" class="hidden text-center text-xl font-semibold text-yellow-600 mb-4"></div>

        <!-- Initial Prompt Area -->
        <div id="initial-prompt-section">
            <div class="flex justify-between items-end mb-2">
                <label for="story-prompt" class="block text-sm font-medium text-gray-700">
                    Start your adventure! (e.g., A fantasy quest...)
                </label>
                <button id="generate-prompt-btn" class="text-xs bg-blue-100 hover:bg-blue-200 text-blue-700 font-semibold py-1 px-3 rounded-full transition duration-150 flex items-center gap-1">
                    ✨ Generate Idea
                </button>
            </div>
            <textarea id="story-prompt" rows="3" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 text-gray-800" placeholder="Enter your story idea here..."></textarea>
            
            <!-- TONE SLIDER SECTION -->
            <div class="mt-6 mb-2 bg-gray-50 p-4 rounded-xl border border-gray-200">
                <div class="flex justify-between items-center mb-3">
                    <label for="tone-slider" class="text-sm font-bold text-gray-700">Story Tone</label>
                    <span id="tone-display" class="text-xs font-semibold px-2 py-1 bg-white border border-gray-200 text-gray-700 rounded-lg shadow-sm">Neutral 😐</span>
                </div>
                
                <input type="range" id="tone-slider" min="0" max="4" value="2" step="1" 
                       class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
                
                <div class="flex justify-between text-[10px] text-gray-400 mt-2 uppercase tracking-wider font-medium px-1">
                    <span>Creepy</span>
                    <span>Sad</span>
                    <span>Neutral</span>
                    <span>Funny</span>
                    <span>Epic</span>
                </div>
            </div>

            <button id="start-story-btn" class="mt-6 w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition duration-150 shadow-md">
                Begin the Tale
            </button>
        </div>

        <!-- Story and Interaction Area -->
        <div id="story-area" class="hidden">
            <!-- Story Text Display -->
            <div id="story-text" class="story-scroll h-64 overflow-y-auto p-4 bg-gray-50 border border-gray-200 rounded-lg text-gray-800 leading-relaxed shadow-inner mb-4">
                <!-- Story segments will be injected here -->
            </div>

            <!-- Choices Area -->
            <div id="choices-area" class="space-y-3">
                <!-- Choice buttons will be injected here -->
            </div>
            
            <button id="restart-btn" class="mt-6 w-full bg-red-500 text-white font-semibold py-2 rounded-lg hover:bg-red-600 transition duration-150 shadow-md hidden">
                Restart Story
            </button>
        </div>

        <!-- Loading Indicator -->
        <div id="loading-indicator" class="hidden text-center py-8">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-t-4 border-blue-500 border-gray-200"></div>
            <p class="mt-2 text-blue-600 font-medium">Weaving the narrative...</p>
        </div>
        
        <!-- Error Message Box -->
        <div id="error-message" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
            <strong class="font-bold">Oops!</strong>
            <span class="block sm:inline">Something went wrong while generating the story. Please try again.</span>
        </div>
        
        <!-- Footer -->
        <footer class="text-center text-xs text-gray-400 pt-4 border-t mt-6">
            Powered by the Gemini API.
        </footer>
    </div>

    <script type="module">
        // Global Variables provided by the environment
        const apiKey = ""; // Canvas will provide the key at runtime
        let currentApiKey = apiKey;
        
        const MAX_RETRIES = 5;

        // UI Element References
        const appContainer = document.getElementById('app-container');
        const initialPromptSection = document.getElementById('initial-prompt-section');
        const storyArea = document.getElementById('story-area');
        const storyTextDisplay = document.getElementById('story-text');
        const choicesArea = document.getElementById('choices-area');
        const startStoryBtn = document.getElementById('start-story-btn');
        const generatePromptBtn = document.getElementById('generate-prompt-btn');
        const restartBtn = document.getElementById('restart-btn');
        const loadingIndicator = document.getElementById('loading-indicator');
        const errorMessage = document.getElementById('error-message');
        const storyPromptInput = document.getElementById('story-prompt');
        
        // Tone Slider References
        const toneSlider = document.getElementById('tone-slider');
        const toneDisplay = document.getElementById('tone-display');
        
        const toneLabels = [
            "Creepy 👻",
            "Sad 😢",
            "Neutral 😐",
            "Funny 😂",
            "Epic ⚔️"
        ];

        let chatHistory = [];
        let storyRunning = false;

        // JSON Schema for structured generation
        const storySchema = {
            type: "OBJECT",
            properties: {
                "storyText": {
                    "type": "STRING",
                },
                "choices": {
                    "type": "ARRAY",
                    "items": {
                        "type": "OBJECT",
                        "properties": {
                            "id": { "type": "NUMBER" },
                            "text": { "type": "STRING" }
                        },
                        "required": ["id", "text"]
                    }
                },
                "isEnding": {
                    "type": "BOOLEAN"
                }
            },
            required: ["storyText", "choices", "isEnding"]
        };

        const systemInstruction = "You are a Dungeon Master/Game Narrator for an interactive text adventure. Your task is to continue the story, always referring to the player in the second person ('you'). 1. Generate a single, compelling new narrative segment (storyText). Keep it concise, around 100-150 words. 2. Based on the new situation, propose 2 or 3 distinct and logical choices (choices) for the player's next action. 3. If the story reaches a natural conclusion (success or failure), set isEnding to true and propose only one choice: 'Start a New Adventure'. 4. ALWAYS respond STRICTLY in the provided JSON format. Do not include any external commentary.";

        // --- Tone Slider Logic ---
        toneSlider.addEventListener('input', () => {
            const val = parseInt(toneSlider.value);
            toneDisplay.textContent = toneLabels[val];
        });

        // --- Core Functions ---
        
        function getApiUrl() {
            return `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${currentApiKey}`;
        }
        
        async function fetchWithRetry(url, options, retries = MAX_RETRIES) {
            try {
                let response = await fetch(url, options);
                if (response.status === 429 && retries > 0) {
                    const delay = Math.pow(2, MAX_RETRIES - retries) * 1000 + Math.random() * 1000;
                    await new Promise(resolve => setTimeout(resolve, delay));
                    return await fetchWithRetry(url, options, retries - 1);
                }
                if (!response.ok) {
                    throw new Error(`API request failed with status ${response.status}`);
                }
                return response;
            } catch (error) {
                if (retries > 0) {
                    const delay = Math.pow(2, MAX_RETRIES - retries) * 1000 + Math.random() * 1000;
                    await new Promise(resolve => setTimeout(resolve, delay));
                    return await fetchWithRetry(url, options, retries - 1);
                }
                throw error;
            }
        }

        function safeJsonParse(rawText) {
            let jsonString = rawText.trim();
            const jsonFenceRegex = /```(json)?\s*([\s\S]*?)\s*```/i;
            const match = jsonString.match(jsonFenceRegex);

            if (match && match[2]) {
                jsonString = match[2].trim();
            } else {
                jsonString = jsonString.replace(/^`+|`+$/g, '').trim();
            }

            try {
                return JSON.parse(jsonString);
            } catch (e) {
                console.error("Failed to parse JSON after cleaning:", e);
                return null;
            }
        }

        /**
         * Generates a random story prompt using the LLM.
         */
        async function handleGeneratePrompt() {
            // Show simplified loading state in the prompt area
            storyPromptInput.value = "Generating a creative idea...";
            storyPromptInput.disabled = true;
            generatePromptBtn.disabled = true;
            errorMessage.classList.add('hidden');
            
            // Get selected tone
            const toneIndex = parseInt(toneSlider.value);
            const selectedTone = toneLabels[toneIndex];

            const promptPayload = {
                contents: [{ role: "user", parts: [{ text: `Generate a single, unique, and engaging premise for an interactive text adventure game with a ${selectedTone} tone. Do not make it extremely weird and exotic. It should be down to earth and real, not theoretical. It should be one or two sentences long. Do not include choices, just the premise.` }] }],
                generationConfig: {
                    responseMimeType: "text/plain",
                }
            };

            try {
                const response = await fetchWithRetry(getApiUrl(), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(promptPayload)
                });

                const result = await response.json();
                const idea = result.candidates?.[0]?.content?.parts?.[0]?.text;

                if (idea) {
                    storyPromptInput.value = idea.trim();
                } else {
                    storyPromptInput.value = "";
                    showError("Could not generate an idea. Please try again.");
                }

            } catch (error) {
                console.error("Error generating prompt:", error);
                storyPromptInput.value = "";
                showError(`Failed to generate idea: ${error.message}`);
            } finally {
                storyPromptInput.disabled = false;
                generatePromptBtn.disabled = false;
                storyPromptInput.focus();
            }
        }

        async function fetchStorySegment(userMessage) {
            loadingIndicator.classList.remove('hidden');
            errorMessage.classList.add('hidden');
            choicesArea.innerHTML = ''; 
            storyRunning = true;

            chatHistory.push({ role: "user", parts: [{ text: userMessage }] });

            const payload = {
                contents: chatHistory,
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: storySchema,
                },
                systemInstruction: {
                    parts: [{ text: systemInstruction }]
                },
            };

            try {
                const response = await fetchWithRetry(getApiUrl(), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                const candidate = result.candidates?.[0];

                if (candidate && candidate.content?.parts?.[0]?.text) {
                    const rawText = candidate.content.parts[0].text;
                    const storyData = safeJsonParse(rawText);

                    if (storyData) {
                        chatHistory.push({ role: "model", parts: [{ text: rawText }] });
                        displayStorySegment(storyData);
                    } else {
                        chatHistory.pop();
                        showError("The story generator returned malformed data. Trying again might help.");
                    }
                } else {
                    chatHistory.pop();
                    console.error("Unexpected API response structure:", result);
                    showError("The story generator returned an unexpected response.");
                }

            } catch (error) {
                chatHistory.pop();
                console.error("Error during story generation:", error);
                showError(`Failed to connect to the story service: ${error.message}`);
            } finally {
                loadingIndicator.classList.add('hidden');
                storyRunning = false;
            }
        }

        function displayStorySegment(storyData) {
            const newSegment = document.createElement('p');
            newSegment.className = 'mt-3 pt-3 border-t border-gray-100 italic';
            newSegment.textContent = storyData.storyText || "The story continues... (Text missing)";
            storyTextDisplay.appendChild(newSegment);
            storyTextDisplay.scrollTop = storyTextDisplay.scrollHeight;

            choicesArea.innerHTML = '';

            if (storyData.isEnding) {
                const endingMessage = document.createElement('p');
                endingMessage.className = 'text-lg font-bold text-center text-green-700 mt-4';
                endingMessage.textContent = "The story has reached its end. Click below to embark on a new adventure!";
                choicesArea.appendChild(endingMessage);
                restartBtn.classList.remove('hidden');
            } else {
                if (Array.isArray(storyData.choices) && storyData.choices.length > 0) {
                    storyData.choices.forEach((choice, index) => {
                        let choiceText = `Option ${index + 1}`;
                        if (typeof choice === 'string') {
                            choiceText = choice;
                        } else if (typeof choice === 'object' && choice !== null) {
                            choiceText = choice.text || choice.description || choice.label || choice.action || choice.value || choice.content || choice.option || choice.choice || choiceText;
                        }
                        
                        const button = document.createElement('button');
                        button.textContent = choiceText;
                        button.className = 'w-full text-left bg-blue-500 hover:bg-blue-600 text-white font-medium py-3 px-4 rounded-lg transition duration-150 shadow-md transform hover:scale-[1.01]';
                        button.onclick = () => handleChoice(choiceText);
                        choicesArea.appendChild(button);
                    });
                    restartBtn.classList.add('hidden'); 
                } else {
                    const error = document.createElement('p');
                    error.className = 'text-lg font-bold text-center text-red-500 mt-4';
                    error.textContent = "Error: The story is stuck! The model failed to provide valid choices. Please restart.";
                    choicesArea.appendChild(error);
                    restartBtn.classList.remove('hidden'); 
                }
            }
        }

        function handleInitialSubmit() {
            const prompt = storyPromptInput.value.trim();
            if (!prompt) {
                showError("Please enter a story prompt to begin.");
                return;
            }
            
            // Get selected tone
            const toneIndex = parseInt(toneSlider.value);
            const selectedTone = toneLabels[toneIndex];
            
            chatHistory = [];
            storyTextDisplay.innerHTML = '';
            restartBtn.classList.add('hidden');
            errorMessage.classList.add('hidden');
            initialPromptSection.classList.add('hidden');
            storyArea.classList.remove('hidden');
            
            // Pass the tone in the initial message
            const initialUserMessage = `Start a new interactive text adventure based on this theme: "${prompt}". The tone of the story should be: ${selectedTone}. Begin the story, introducing the setting and the first choice.`;
            fetchStorySegment(initialUserMessage);
        }

        function handleChoice(choiceText) {
            if (storyRunning) return;
            const userAction = document.createElement('p');
            userAction.className = 'mt-3 text-sm italic text-gray-500 font-semibold';
            userAction.textContent = `> You choose to: ${choiceText}`;
            storyTextDisplay.appendChild(userAction);
            storyTextDisplay.scrollTop = storyTextDisplay.scrollHeight;
            fetchStorySegment(`I choose to: ${choiceText}`);
        }
        
        function handleRestart() {
            storyArea.classList.add('hidden');
            initialPromptSection.classList.remove('hidden');
            storyPromptInput.value = '';
            storyTextDisplay.innerHTML = '';
            choicesArea.innerHTML = '';
            restartBtn.classList.add('hidden');
            errorMessage.classList.add('hidden');
            chatHistory = [];
        }
        
        function showError(message) {
            errorMessage.querySelector('span').textContent = message;
            errorMessage.classList.remove('hidden');
            loadingIndicator.classList.add('hidden');
            storyRunning = false;
        }

        startStoryBtn.addEventListener('click', handleInitialSubmit);
        generatePromptBtn.addEventListener('click', handleGeneratePrompt);
        restartBtn.addEventListener('click', handleRestart);

        appContainer.style.display = 'block';

        // -----------------------------------------------------------------
        // 5️⃣  Show visitor's public IP address in gold letters near the top
        // -----------------------------------------------------------------
        async function showVisitorIp() {
            const ipEl = document.getElementById('ip-message');
            if (!ipEl) return;
            try {
                const resp = await fetch('https://api.ipify.org?format=json');
                if (!resp.ok) throw new Error('IP fetch failed');
                const data = await resp.json();
                ipEl.textContent = `Your IP: ${data.ip}`;
                ipEl.classList.remove('hidden');
            } catch (e) {
                console.warn('Could not retrieve IP address:', e);
                // Silently fail – keep the element hidden.
            }
        }
        // Run the IP lookup as soon as the UI is visible
        showVisitorIp();

    </script>
</body>
</html>
